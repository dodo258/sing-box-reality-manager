name: srm checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl shellcheck
      - name: Check syntax, lint and reproducible bundle
        run: |
          for file in build.sh srm.sh lib/*.sh tests/*.sh tests/support/*.sh install.sh; do bash -n "$file"; done
          bash build.sh
          git diff --exit-code -- dist/
          # Modules share variables, so they are linted together as the bundle.
          shellcheck -S warning -s bash dist/srm build.sh srm.sh
      - name: Check tracked files for real addresses, UUIDs, keys, domains, emails and home paths
        run: bash tests/no-private-info.sh
      - name: Download checksum-pinned sing-box core
        run: |
          source ./srm.sh
          # Tests use the tested release; installation itself takes the newest stable one.
          core_fetch "$RUNNER_TEMP/sing-box" "$CORE_VERSION" "$(core_pinned_hash)"
          # The naive client in tests/traffic.sh loads libcronet.so from the core's
          # directory; it comes from the same checksum-pinned archive (servers do not need it).
          fetch "https://github.com/SagerNet/sing-box/releases/download/v$CORE_VERSION/sing-box-$CORE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/core.tar.gz"
          [[ $(sha256 "$RUNNER_TEMP/core.tar.gz") == "$(core_pinned_hash)" ]]
          tar -xzf "$RUNNER_TEMP/core.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "sing-box-$CORE_VERSION-linux-amd64/libcronet.so"
      - name: Download checksum-pinned mihomo (Clash Meta) client
        run: |
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gunzip "$RUNNER_TEMP/mihomo.gz" && chmod 755 "$RUNNER_TEMP/mihomo"
      - name: Download checksum-pinned snell-server v6 and v5
        run: |
          source ./srm.sh
          snell_download 6 "$RUNNER_TEMP/snell-server-v6"
          snell_download 5 "$RUNNER_TEMP/snell-server-v5"
      - name: Unit tests and real proxy traffic through the core
        env:
          TEST_CORE: ${{ runner.temp }}/sing-box
          TEST_MIHOMO: ${{ runner.temp }}/mihomo
          TEST_SNELL_V6: ${{ runner.temp }}/snell-server-v6
          TEST_SNELL_V5: ${{ runner.temp }}/snell-server-v5
        run: |
          for test in cli menu quick protocols clients snell state local traffic snell-traffic updates firewall firewall-iptables hop certificates-menu management migrate profiles; do
            echo "::group::tests/$test.sh"
            bash "tests/$test.sh"
            echo "::endgroup::"
          done
      - name: Verify real UFW and iptables in isolated network and mount namespaces
        run: |
          sudo apt-get install -y --no-install-recommends ufw nftables
          sudo env GITHUB_ACTIONS=true unshare --net --mount bash tests/firewall-live.sh
      - name: Verify real systemd install, configuration transaction and uninstall
        run: sudo env GITHUB_ACTIONS=true bash tests/install-live.sh
      # Last: firewalld stays installed on the runner (never started).
      - name: Verify real firewall-offline-cmd while firewalld is stopped
        run: |
          # policy-rc.d keeps the package from starting firewalld on the runner.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          sudo apt-get install -y --no-install-recommends firewalld
          sudo rm /usr/sbin/policy-rc.d
          sudo systemctl disable --now firewalld
          sudo env GITHUB_ACTIONS=true unshare --mount bash tests/firewalld-live.sh
