name: srm checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl shellcheck
      - name: Check syntax, lint and reproducible bundle
        run: |
          for file in build.sh srm.sh lib/*.sh tests/*.sh tests/support/*.sh install.sh; do bash -n "$file"; done
          bash build.sh
          git diff --exit-code -- dist/
          # Modules share variables, so they are linted together as the bundle.
          shellcheck -S warning -s bash dist/srm build.sh srm.sh
      - name: Download checksum-pinned sing-box core
        run: |
          source ./srm.sh
          core_download "$RUNNER_TEMP/sing-box"
          # The naive client in tests/traffic.sh loads libcronet.so from the core's
          # directory; it comes from the same checksum-pinned archive (servers do not need it).
          fetch "https://github.com/SagerNet/sing-box/releases/download/v$CORE_VERSION/sing-box-$CORE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/core.tar.gz"
          [[ $(sha256 "$RUNNER_TEMP/core.tar.gz") == 12cb2816b52febb356f6a885b740cc8758c3f30b8ae0ca8edba80f0d2d35343f ]]
          tar -xzf "$RUNNER_TEMP/core.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "sing-box-$CORE_VERSION-linux-amd64/libcronet.so"
      - name: Download checksum-pinned mihomo (Clash Meta) client
        run: |
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gunzip "$RUNNER_TEMP/mihomo.gz" && chmod 755 "$RUNNER_TEMP/mihomo"
      - name: Unit tests and real proxy traffic through the core
        env:
          TEST_CORE: ${{ runner.temp }}/sing-box
          TEST_MIHOMO: ${{ runner.temp }}/mihomo
        run: |
          for test in cli menu protocols clients state local traffic updates firewall certificates-menu management; do
            echo "::group::tests/$test.sh"
            bash "tests/$test.sh"
            echo "::endgroup::"
          done
      - name: Verify real UFW in isolated network and mount namespaces
        run: |
          sudo apt-get install -y --no-install-recommends ufw
          sudo env GITHUB_ACTIONS=true unshare --net --mount bash tests/firewall-live.sh
      - name: Verify real systemd install, configuration transaction and uninstall
        run: sudo env GITHUB_ACTIONS=true bash tests/install-live.sh
