name: snell probe (temporary)
on:
  push:
    branches: ['agent/1010-snell-shadowtls']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe snell-server binaries
        run: |
          set -x
          cd "$RUNNER_TEMP"
          for v in v6.0.0rc2 v5.0.1; do
            curl -fsSL --max-time 120 -o s.zip "https://dl.nssurge.com/snell/snell-server-$v-linux-amd64.zip"
            sha256sum s.zip
            rm -rf "$v"; mkdir "$v"; unzip -q s.zip -d "$v"
            b="$v/snell-server"
            "$b" --help 2>&1 || true
            "$b" -h 2>&1 || true
            "$b" -v 2>&1 || true
            "$b" --version 2>&1 || true
            printf 'y\n' | timeout 10 "$b" --wizard -c "$PWD/$v.conf" 2>&1 || true
            cat "$v.conf" || true
            printf '[snell-server]\nlisten = 127.0.0.1:17777\npsk = short\n' > bad.conf
            timeout 5 "$b" -c bad.conf 2>&1 || echo "rc=$?"
            printf '[snell-server]\nlisten = 127.0.0.1:17777\npsk = abcdefghijklmnopqrstuvwx\nmode = unshaped\nbogus = 1\n' > m.conf
            timeout 5 "$b" -c m.conf 2>&1 || echo "rc=$?"
            printf '[snell-server]\nlisten = 127.0.0.1:17777\npsk = abcdefghijklmnopqrstuvwx\nipv6 = false\n' > m5.conf
            timeout 5 "$b" -c m5.conf 2>&1 || echo "rc=$?"
            ldd "$b" 2>&1 || true
          done
